# the name by which the project can be referenced within Serena
project_name: "biblequize"

# Polyglot: Spring Boot (Java 17) BE + Vite/React/TS FE + Tailwind + Capacitor mobile.
# Java is the first/primary backend; typescript covers the web FE.
languages: ["java", "typescript"]

encoding: "utf-8"

# Native line endings preserved by Serena's own files; project source mixed
# (Java LF, Windows-edited markdown CRLF). Don't normalise.
line_ending:

# Use global LSP backend from serena_config.yml
language_backend:

ignore_all_files_in_gitignore: true

ls_specific_settings: {}

# Monorepo workspace folders for cross-package symbol resolution.
# (TypeScript only — Serena ignores for Java.)
additional_workspace_folders:
  - apps/web
  - apps/mobile

# Heavy/irrelevant paths that should never be loaded.
ignored_paths:
  - "apps/mobile-old-backup-20260408/**"
  - "archive/**"
  - "**/node_modules/**"
  - "**/target/**"
  - "**/dist/**"
  - "**/.next/**"
  - "playwright-report/**"
  - "test-results/**"
  - "apps/web/.test-baseline"
  - "apps/api/.test-baseline"
  - "apps/api/src/main/resources/seed/questions/**"  # ~130 JSON seed files

read_only: false

excluded_tools: []

included_optional_tools: []

fixed_tools: []

default_modes:

added_modes:

# Seed prompt loaded on every project activation. Keep brief — heavy context
# belongs in memory files loaded on demand.
initial_prompt: |
  This is BibleQuiz — a Vietnamese Protestant Bible-study quiz platform
  (Spring Boot 3.3 + React 18 + MySQL 8 + Redis).
  CANONICAL source of project rules is `CLAUDE.md` at the repo root.
  Read `CLAUDE.md` before writing anything; it overrides general defaults.
  Specs live under `docs/spec/`; task tracker is `TODO.md` (index)
  + `docs/todo/active/<slug>.md` (one file per work-unit).
  Before touching DB schema, read `docs/dev/architecture.md` + the
  relevant `application-*.yml`. Default working profile is `dev` locally,
  `docker` in production (see deploy/compose.prod.yml).

symbol_info_budget:

read_only_memory_patterns: []

ignored_memory_patterns: []
