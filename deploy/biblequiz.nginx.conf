# Host (edge) nginx for forbible.org — reference copy of the live config on the
# prod host (/etc/nginx/sites-available/forbible). NOT pushed by deploy; the
# server's file is the source of truth and is partly Certbot-managed.
#
# TLS, the :80 -> :443 redirect, and cert paths are managed by Certbot
# (cert covers forbible.org + www.forbible.org + be.forbible.org). The www -> apex
# 301 below was added for SEO canonical consolidation (2026-06-18).

# App (apex) over HTTPS
server {
    listen 443 ssl; # managed by Certbot
    server_name forbible.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    ssl_certificate /etc/letsencrypt/live/forbible.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forbible.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www -> apex 301 (SEO canonical consolidation)
server {
    listen 443 ssl;
    server_name www.forbible.org;
    ssl_certificate /etc/letsencrypt/live/forbible.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forbible.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://forbible.org$request_uri;
}

# Backend API over HTTPS
server {
    listen 443 ssl; # managed by Certbot
    server_name be.forbible.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    ssl_certificate /etc/letsencrypt/live/forbible.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forbible.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS (managed by Certbot)
server {
    listen 80;
    server_name www.forbible.org forbible.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name be.forbible.org;
    return 301 https://$host$request_uri;
}
