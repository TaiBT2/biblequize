# English overrides (used when Accept-Language resolves to "en").

# Question import warnings/errors ({0}=record index)
imp.explanationMissing=Record {0}: missing explanation
imp.mcqOptions=Record {0}: MCQ requires at least 2 options
imp.answerOutOfRange=Record {0}: correctAnswer {1} out of range (0-{2})
imp.trueFalseAnswer=Record {0}: true_false answer must be 0 or 1
imp.dupInFile=Record {0}: duplicates another record in the file
imp.dupExactDb=Record {0}: exact duplicate of a DB question (skipped)
imp.dupOther=Record {0}: {1}
imp.lengthBias=Record {0}: correct answer is ~{1}x longer than distractors (guessable — balance the 4 option lengths)

# Bible Basics safeguard
question.bibleBasicsSafeguard=Cannot drop the active Bible Basics pool below {0} for language ''{1}'' (would leave {2}).
