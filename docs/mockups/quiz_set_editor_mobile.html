<style>
.phone { width: 360px; margin: 0 auto; background: #11131e; border-radius: 28px; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; color: #e8eaed; border: 1px solid rgba(255,255,255,0.08); }
.phone-screen { background: #0d0f18; min-height: 720px; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.label-tiny { font-size: 10px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px; }
.input-dark { background: #1a1d2e; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; box-sizing: border-box; width: 100%; }
</style>

<div style="background: rgba(10,12,20,0.85); padding: 20px 12px; border-radius: 12px;">

<div class="phone">
<div class="phone-screen">

  <div style="background: #11131e; padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <div class="row" style="gap: 10px; margin-bottom: 10px;">
      <button style="background: transparent; border: none; color: #9ca3af; padding: 4px; display: inline-flex; align-items: center; cursor: pointer;" aria-label="Quay lại">
        <i class="ti ti-arrow-left" style="font-size: 20px;" aria-hidden="true"></i>
      </button>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 14px; color: #ffffff; font-weight: 500;">Bộ câu hỏi mới</span>
        </div>
        <div style="font-size: 11px; color: #9ca3af; margin-top: 1px;">
          <i class="ti ti-circle-check" style="font-size: 11px; color: #4ade80; vertical-align: -1px;" aria-hidden="true"></i>
          <span style="margin-left: 3px;">Đã lưu 8s trước</span>
        </div>
      </div>
      <button style="background: rgba(232,168,50,0.12); color: #e8a832; border: 1px solid rgba(232,168,50,0.25); padding: 6px 11px; border-radius: 7px; font-size: 11px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
        <i class="ti ti-sparkles" style="font-size: 12px;" aria-hidden="true"></i> 45/200
      </button>
    </div>
  </div>

  <div style="background: rgba(50,52,64,0.25); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 12px 16px;">
    <div class="row" style="justify-content: space-between; gap: 8px;">
      <div style="min-width: 0; flex: 1;">
        <div style="font-size: 13px; color: #ffffff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bài học Chúa Nhật · Sự sáng tạo</div>
        <div style="font-size: 11px; color: #9ca3af; margin-top: 2px;">
          <i class="ti ti-book" style="font-size: 11px; vertical-align: -1px;" aria-hidden="true"></i>
          <span style="margin-left: 3px;">Sáng Thế Ký 1-3</span>
        </div>
      </div>
      <button style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #9ca3af; padding: 5px 9px; border-radius: 6px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
        <i class="ti ti-pencil" style="font-size: 12px;" aria-hidden="true"></i> Sửa
      </button>
    </div>
  </div>

  <div style="padding: 12px 16px 8px; display: flex; align-items: center; gap: 8px; background: #0d0f18;">
    <div class="row" style="gap: 5px;">
      <span style="font-size: 11px; color: #6b7280;">Câu</span>
      <span style="font-size: 14px; font-weight: 500; color: #ffffff;">2</span>
      <span style="font-size: 11px; color: #6b7280;">/ 3</span>
    </div>
    <div style="display: flex; gap: 4px; padding: 2px; background: #1a1d2e; border-radius: 6px; flex: 1;">
      <div style="flex: 1; height: 4px; background: rgba(74,222,128,0.3); border-radius: 2px;"></div>
      <div style="flex: 1; height: 4px; background: #e8a832; border-radius: 2px;"></div>
      <div style="flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px;"></div>
    </div>
    <button style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #d1d5db; padding: 5px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
      <i class="ti ti-list" style="font-size: 13px;" aria-hidden="true"></i> Tất cả
    </button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 16px 16px;">

    <div class="row" style="gap: 8px; margin-bottom: 14px; padding-top: 4px;">
      <div style="background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
        <span style="display: inline-block; width: 5px; height: 5px; background: #fbbf24; border-radius: 50%;"></span>
        TB
      </div>
      <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #9ca3af; padding: 4px 9px; border-radius: 999px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;">
        <i class="ti ti-pencil" style="font-size: 11px;" aria-hidden="true"></i>
        Thủ công
      </div>
      <button style="margin-left: auto; background: transparent; border: none; color: #ef4444; padding: 4px; cursor: pointer; display: inline-flex; align-items: center;" aria-label="Xóa câu">
        <i class="ti ti-trash" style="font-size: 16px;" aria-hidden="true"></i>
      </button>
    </div>

    <div style="margin-bottom: 16px;">
      <div class="label-tiny" style="margin-bottom: 6px;">CÂU HỎI</div>
      <textarea rows="3" class="input-dark" style="border-color: rgba(232,168,50,0.3); font-size: 14px; line-height: 1.5; resize: none;">A-đam được Đức Chúa Trời tạo nên từ đâu?</textarea>
    </div>

    <div style="margin-bottom: 16px;">
      <div class="label-tiny" style="margin-bottom: 6px;">ĐÁP ÁN <span style="color: #6b7280; font-weight: 400; letter-spacing: 0; margin-left: 4px;">Bấm vòng để chọn đúng</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px;">

        <div class="row" style="gap: 8px; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 9px 10px;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: rgba(255,107,107,0.15); color: #ff8585; border: 1px solid rgba(255,107,107,0.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0;">A</div>
          <div style="width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 50%; flex-shrink: 0;"></div>
          <input type="text" value="Nước" style="flex: 1; background: transparent; border: none; color: #d1d5db; font-size: 13px; font-family: inherit; padding: 2px 0; outline: none; min-width: 0;" />
        </div>

        <div class="row" style="gap: 8px; background: rgba(74,222,128,0.06); border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; padding: 9px 10px;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: rgba(74,164,255,0.15); color: #8ec6ff; border: 1px solid rgba(74,164,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0;">B</div>
          <div style="width: 14px; height: 14px; background: #4ade80; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
            <i class="ti ti-check" style="font-size: 9px; color: #0a0c14;" aria-hidden="true"></i>
          </div>
          <input type="text" value="Bụi đất" style="flex: 1; background: transparent; border: none; color: #ffffff; font-size: 13px; font-family: inherit; padding: 2px 0; outline: none; font-weight: 500; min-width: 0;" />
        </div>

        <div class="row" style="gap: 8px; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 9px 10px;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: rgba(232,168,50,0.15); color: #e8a832; border: 1px solid rgba(232,168,50,0.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0;">C</div>
          <div style="width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 50%; flex-shrink: 0;"></div>
          <input type="text" value="Đá" style="flex: 1; background: transparent; border: none; color: #d1d5db; font-size: 13px; font-family: inherit; padding: 2px 0; outline: none; min-width: 0;" />
        </div>

        <div class="row" style="gap: 8px; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 9px 10px;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: rgba(132,204,141,0.15); color: #a8d8ad; border: 1px solid rgba(132,204,141,0.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0;">D</div>
          <div style="width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 50%; flex-shrink: 0;"></div>
          <input type="text" value="Cây cối" style="flex: 1; background: transparent; border: none; color: #d1d5db; font-size: 13px; font-family: inherit; padding: 2px 0; outline: none; min-width: 0;" />
        </div>
      </div>
    </div>

    <div style="margin-bottom: 14px;">
      <div class="label-tiny" style="margin-bottom: 6px;">GIẢI THÍCH <span style="color: #ef4444;">*</span></div>
      <textarea rows="3" class="input-dark" style="font-size: 12px; line-height: 1.5; resize: none;">Theo Sáng Thế Ký 2:7, Đức Chúa Trời lấy bụi đất nắn nên hình người, hà sanh khí vào lỗ mũi.</textarea>
    </div>

    <div style="margin-bottom: 14px;">
      <div class="label-tiny" style="margin-bottom: 6px;">CÂU KINH THÁNH <span style="color: #ef4444;">*</span></div>
      <input type="text" value="Sáng Thế Ký 2:7" class="input-dark" style="border-color: rgba(232,168,50,0.25); color: #e8a832; font-family: monospace;" />
      <div style="margin-top: 6px; padding: 8px 10px; background: rgba(232,168,50,0.06); border: 1px solid rgba(232,168,50,0.15); border-radius: 7px; font-size: 11px; color: #d1d5db; line-height: 1.5; font-style: italic;">"Giê-hô-va Đức Chúa Trời bèn lấy bụi đất nắn nên hình người..."</div>
    </div>

    <button style="width: 100%; background: rgba(232,168,50,0.08); color: #e8a832; border: 1px dashed rgba(232,168,50,0.3); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;">
      <i class="ti ti-refresh" style="font-size: 13px;" aria-hidden="true"></i> AI viết lại câu này
    </button>

  </div>

  <div style="background: #11131e; border-top: 1px solid rgba(255,255,255,0.06); padding: 10px 12px 14px;">

    <div class="row" style="gap: 6px; margin-bottom: 10px;">
      <button style="flex: 1; background: rgba(255,255,255,0.04); color: #9ca3af; border: 1px solid rgba(255,255,255,0.08); padding: 9px; border-radius: 8px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;">
        <i class="ti ti-chevron-left" style="font-size: 14px;" aria-hidden="true"></i> Câu 1
      </button>
      <button style="flex: 1; background: rgba(255,255,255,0.04); color: #9ca3af; border: 1px solid rgba(255,255,255,0.08); padding: 9px; border-radius: 8px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;">
        Câu 3 <i class="ti ti-chevron-right" style="font-size: 14px;" aria-hidden="true"></i>
      </button>
    </div>

    <div class="row" style="gap: 6px; margin-bottom: 10px;">
      <button style="flex: 1; background: rgba(232,168,50,0.12); color: #e8a832; border: 1px solid rgba(232,168,50,0.3); padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;">
        <i class="ti ti-sparkles" style="font-size: 14px;" aria-hidden="true"></i> AI tạo nháp
      </button>
      <button style="flex: 1; background: rgba(255,255,255,0.04); color: #d1d5db; border: 1px solid rgba(255,255,255,0.1); padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;">
        <i class="ti ti-plus" style="font-size: 14px;" aria-hidden="true"></i> Thêm tay
      </button>
    </div>

    <button style="width: 100%; background: #e8a832; color: #1a1226; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
      <i class="ti ti-rocket" style="font-size: 16px;" aria-hidden="true"></i> Xuất bản (3 câu)
    </button>
  </div>

</div>
</div>

</div>
