<div style="background: rgba(10, 12, 20, 0.92); padding: 32px 24px; border-radius: 12px; font-family: 'Inter', -apple-system, sans-serif; min-height: 200px;">

  <div style="max-width: 580px; margin: 0 auto; background: #11131e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 48px rgba(0,0,0,0.4);">

    <div style="padding: 20px 24px 0; display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
        <i class="ti ti-books" style="font-size: 22px; color: #e8a832;" aria-hidden="true"></i>
        <div style="font-size: 16px; font-weight: 500; color: #ffffff;">Tạo bộ câu hỏi mới</div>
      </div>
      <div style="display: inline-flex; align-items: center; gap: 5px; background: rgba(232,168,50,0.10); border: 1px solid rgba(232,168,50,0.22); padding: 4px 9px; border-radius: 999px; font-size: 11px; color: #e8a832;">
        <i class="ti ti-sparkles" style="font-size: 12px;" aria-hidden="true"></i>
        <span>Hôm nay: 45/200</span>
      </div>
      <button style="background: transparent; border: none; color: #6b7280; cursor: pointer; padding: 4px;" aria-label="Đóng">
        <i class="ti ti-x" style="font-size: 18px;" aria-hidden="true"></i>
      </button>
    </div>

    <div style="padding: 16px 24px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button style="background: #e8a832; color: #1a1226; border: none; padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <i class="ti ti-sparkles" style="font-size: 14px;" aria-hidden="true"></i> AI tạo
      </button>
      <button style="background: rgba(255,255,255,0.04); color: #9ca3af; border: 1px solid rgba(255,255,255,0.06); padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 400; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <i class="ti ti-pencil" style="font-size: 14px;" aria-hidden="true"></i> Tự soạn
      </button>
    </div>

    <div style="padding: 20px 24px 0;">

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 11px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px; margin-bottom: 6px;">TÊN BỘ CÂU HỎI <span style="color: #ef4444;">*</span></label>
        <input type="text" placeholder="VD: Bài học Chúa Nhật · Ân điển của Đức Chúa Trời" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; padding: 11px 13px; border-radius: 8px; font-size: 13px; font-family: inherit; box-sizing: border-box;" />
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 11px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px; margin-bottom: 6px;">SÁCH KINH THÁNH</label>
        <div style="position: relative;">
          <input type="text" value="Sáng Thế Ký" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(232,168,50,0.3); color: #ffffff; padding: 11px 30px 11px 13px; border-radius: 8px; font-size: 13px; font-family: inherit; box-sizing: border-box;" />
          <i class="ti ti-chevron-down" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #6b7280;" aria-hidden="true"></i>
        </div>
      </div>

      <div style="margin-bottom: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 14px;">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
          <i class="ti ti-bookmarks" style="font-size: 13px; color: #9ca3af;" aria-hidden="true"></i>
          <span style="font-size: 11px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px;">PHẠM VI</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div>
            <div style="font-size: 11px; font-weight: 500; color: #d1d5db; margin-bottom: 6px;">Chương</div>
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center;">
              <input type="number" value="1" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; padding: 9px; border-radius: 7px; font-size: 13px; text-align: center; box-sizing: border-box;" />
              <span style="color: #6b7280; font-size: 11px;">đến</span>
              <input type="number" value="3" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; padding: 9px; border-radius: 7px; font-size: 13px; text-align: center; box-sizing: border-box;" />
            </div>
          </div>
          <div>
            <div style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;">
              <span style="font-size: 11px; font-weight: 500; color: #d1d5db;">Câu</span>
              <span style="font-size: 11px; color: #6b7280;">tuỳ chọn</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center;">
              <input type="number" placeholder="1" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.06); color: #ffffff; padding: 9px; border-radius: 7px; font-size: 13px; text-align: center; box-sizing: border-box;" />
              <span style="color: #6b7280; font-size: 11px;">đến</span>
              <input type="number" placeholder="31" style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.06); color: #ffffff; padding: 9px; border-radius: 7px; font-size: 13px; text-align: center; box-sizing: border-box;" />
            </div>
          </div>
        </div>
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px; margin-bottom: 6px;">
          <span>CHỦ ĐỀ BÀI HỌC</span>
          <span style="color: #6b7280; font-weight: 400; letter-spacing: 0;">Không bắt buộc</span>
        </label>
        <textarea rows="2" placeholder="VD: Sự sáng tạo, sự sa ngã, lời hứa cứu chuộc..." style="width: 100%; background: #1a1d2e; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; padding: 11px 13px; border-radius: 8px; font-size: 13px; font-family: inherit; box-sizing: border-box; resize: none;"></textarea>
      </div>

      <div style="margin-bottom: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 14px;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <i class="ti ti-chart-bar" style="font-size: 13px; color: #9ca3af;" aria-hidden="true"></i>
            <span style="font-size: 11px; font-weight: 500; color: #9ca3af; letter-spacing: 0.6px;">PHÂN BỔ ĐỘ KHÓ</span>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px;">
            <span style="color: #6b7280;">Tổng:</span>
            <span style="font-weight: 500; color: #e8a832; font-size: 14px;">5</span>
            <span style="color: #6b7280;">câu</span>
          </div>
        </div>

        <div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 14px; background: rgba(255,255,255,0.05);">
          <div style="width: 40%; background: #4ade80;"></div>
          <div style="width: 40%; background: #fbbf24;"></div>
          <div style="width: 20%; background: #ef4444;"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;">

          <div style="background: rgba(74,222,128,0.06); border: 1px solid rgba(74,222,128,0.2); border-radius: 8px; padding: 10px 8px;">
            <div style="display: flex; align-items: center; gap: 5px; justify-content: center; margin-bottom: 8px;">
              <span style="display: inline-block; width: 7px; height: 7px; background: #4ade80; border-radius: 50%;"></span>
              <span style="font-size: 11px; font-weight: 500; color: #4ade80; letter-spacing: 0.5px;">DỄ</span>
            </div>
            <div style="display: grid; grid-template-columns: 24px 1fr 24px; gap: 4px; align-items: center;">
              <button style="background: rgba(255,255,255,0.06); color: #d1d5db; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">−</button>
              <div style="font-size: 18px; font-weight: 500; color: #ffffff; text-align: center;">2</div>
              <button style="background: rgba(74,222,128,0.15); color: #4ade80; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">+</button>
            </div>
          </div>

          <div style="background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2); border-radius: 8px; padding: 10px 8px;">
            <div style="display: flex; align-items: center; gap: 5px; justify-content: center; margin-bottom: 8px;">
              <span style="display: inline-block; width: 7px; height: 7px; background: #fbbf24; border-radius: 50%;"></span>
              <span style="font-size: 11px; font-weight: 500; color: #fbbf24; letter-spacing: 0.5px;">TB</span>
            </div>
            <div style="display: grid; grid-template-columns: 24px 1fr 24px; gap: 4px; align-items: center;">
              <button style="background: rgba(255,255,255,0.06); color: #d1d5db; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">−</button>
              <div style="font-size: 18px; font-weight: 500; color: #ffffff; text-align: center;">2</div>
              <button style="background: rgba(251,191,36,0.15); color: #fbbf24; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">+</button>
            </div>
          </div>

          <div style="background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 10px 8px;">
            <div style="display: flex; align-items: center; gap: 5px; justify-content: center; margin-bottom: 8px;">
              <span style="display: inline-block; width: 7px; height: 7px; background: #ef4444; border-radius: 50%;"></span>
              <span style="font-size: 11px; font-weight: 500; color: #ef4444; letter-spacing: 0.5px;">KHÓ</span>
            </div>
            <div style="display: grid; grid-template-columns: 24px 1fr 24px; gap: 4px; align-items: center;">
              <button style="background: rgba(255,255,255,0.06); color: #d1d5db; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">−</button>
              <div style="font-size: 18px; font-weight: 500; color: #ffffff; text-align: center;">1</div>
              <button style="background: rgba(239,68,68,0.15); color: #ef4444; border: none; width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">+</button>
            </div>
          </div>

        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.04);">
          <span style="font-size: 11px; color: #6b7280;">Gợi ý:</span>
          <button style="background: rgba(255,255,255,0.04); color: #d1d5db; border: 1px solid rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
            <i class="ti ti-scale" style="font-size: 12px;" aria-hidden="true"></i> Đều nhau
          </button>
          <button style="background: rgba(232,168,50,0.10); color: #e8a832; border: 1px solid rgba(232,168,50,0.22); padding: 4px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
            <i class="ti ti-chart-pie" style="font-size: 12px;" aria-hidden="true"></i> Đề xuất 40/40/20
          </button>
        </div>

      </div>

    </div>

    <div style="padding: 16px 24px 20px; border-top: 1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.015);">
      <button style="width: 100%; background: #e8a832; color: #1a1226; border: none; padding: 13px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        <i class="ti ti-sparkles" style="font-size: 16px;" aria-hidden="true"></i>
        Tạo 5 câu hỏi với AI <span style="opacity: 0.7; font-weight: 400; margin-left: 4px;">· 2 dễ + 2 TB + 1 khó</span>
      </button>
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 11px; color: #6b7280;">
        <i class="ti ti-clock" style="font-size: 12px;" aria-hidden="true"></i>
        <span>AI tạo nháp ~20-30s · Bạn xem lại + chỉnh sửa trước khi lưu</span>
      </div>
    </div>

  </div>

</div>
